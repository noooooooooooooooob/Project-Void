<title>Project Void 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* 레이아웃: 위 탭 바 → 카드 그리드 / 덱 화면은 왼쪽 덱 목록 + 오른쪽 덱 상세. 편집은 오른쪽에서 열리는 시트 */
:root {
  --bg: #f2f1f5; --surface: #ffffff; --fg: #1d1b24; --muted: #686577; --line: #dcd9e3; --accent: #5b4bd6;
  --face: #fbfaf7; --art: #e7e4ee; --art-line: #d3cfdc;
  --attack: #c3413a; --skill: #2d6cc9; --special: #8b3fc2; --danger: #b3261e; --on-accent: #ffffff; --kw: #b0661a;
  --display: "Black Han Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131219; --surface: #1c1a24; --fg: #ecebf2; --muted: #9a97a8; --line: #302d3c; --accent: #a092ff;
    --face: #24222d; --art: #2e2b38; --art-line: #3b3848;
    --attack: #e0625a; --skill: #5b93e8; --special: #b06ee0; --danger: #f2867e; --on-accent: #131219; --kw: #f0a54a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131219; --surface: #1c1a24; --fg: #ecebf2; --muted: #9a97a8; --line: #302d3c; --accent: #a092ff;
  --face: #24222d; --art: #2e2b38; --art-line: #3b3848;
  --attack: #e0625a; --skill: #5b93e8; --special: #b06ee0; --danger: #f2867e; --on-accent: #131219; --kw: #f0a54a;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 상단 */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.brand { font-family: var(--display); font-weight: 400; font-size: 22px; letter-spacing: .02em; margin: 0; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 6px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
.top .spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--on-accent); }
.btn:disabled { opacity: .45; cursor: default; }
.notice { color: var(--muted); font-size: 13px; }
.usage { font-variant-numeric: tabular-nums; }
.usage.warn { color: var(--danger); font-weight: 600; }

/* 툴바 */
.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { border-color: var(--fg); font-weight: 600; }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.toolbar input[type="search"], .toolbar select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 10px; min-width: 0; }
.toolbar input[type="search"] { flex: 1 1 160px; max-width: 260px; }

/* 카드 그리드 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 16px; }
.empty { border: 1px dashed var(--line); border-radius: 10px; padding: 32px 16px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; grid-column: 1 / -1; }

/* 카드 한 장 (Notion 예시 그림: 이름 / SP 원이 겹친 일러스트 / 오른쪽 위 공격 종류·범위 / 설명) */
.card { --cat: var(--attack); position: relative; aspect-ratio: 5 / 7; max-width: 100%; background: var(--face); border: 3px solid var(--cat); border-radius: 12px; padding: 10px 12px 30px; display: grid; grid-template-rows: auto auto 1fr; gap: 8px; text-align: left; overflow: hidden; color: var(--fg); }
.card.cat-skill { --cat: var(--skill); }
.card.cat-special { --cat: var(--special); }
button.card { cursor: pointer; transition: transform .12s ease; width: 100%; }
button.card:hover { transform: translateY(-2px); }
.card-name { font-family: var(--display); font-weight: 400; font-size: 17px; line-height: 1.2; margin: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-art { position: relative; margin: 4px 22px 0 10px; aspect-ratio: 4 / 3; background: var(--art); border: 1px solid var(--art-line); border-radius: 4px; background-image: repeating-linear-gradient(135deg, transparent 0 7px, var(--art-line) 7px 8px); }
.card-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 3px; }
.card-sp { position: absolute; left: -14px; top: -12px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--cat); color: var(--on-accent); font-family: var(--display); font-size: 16px; border: 2px solid var(--face); font-variant-numeric: tabular-nums; }
.card-side { position: absolute; right: -20px; top: -6px; display: grid; gap: 4px; justify-items: center; }
.card-badge { width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; background: var(--fg); color: var(--face); font-size: 12px; font-weight: 600; }
.mini { display: grid; grid-template-columns: repeat(5, 5px); gap: 1px; padding: 3px; background: var(--face); border: 1px solid var(--art-line); border-radius: 4px; }
.mini i { width: 5px; height: 5px; background: var(--art-line); border-radius: 1px; }
.mini i.on { background: var(--cat); }
.mini i.origin { box-shadow: 0 0 0 1px var(--fg); }
.card-text { display: flex; flex-direction: column; gap: 4px; min-height: 0; overflow: hidden; }
.card-kws { display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: 12px; font-weight: 600; color: var(--kw); line-height: 1.4; }
.card-desc { flex: 1; min-height: 0; margin: 0; font-size: 12px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent); mask-image: linear-gradient(to bottom, #000 80%, transparent); }
.card-desc:empty::before { content: "설명 없음"; color: var(--muted); }
.card-count { position: absolute; right: 8px; bottom: 8px; background: var(--fg); color: var(--face); border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.card-cost { position: absolute; left: 8px; bottom: 8px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* 덱 */
.decks { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 720px) { .decks { grid-template-columns: minmax(0, 1fr); } }
.deck-list { display: grid; gap: 4px; }
.deck-list button.item { display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 1px solid transparent; background: none; border-radius: 6px; padding: 8px 10px; }
.deck-list button.item[aria-current="true"] { background: var(--surface); border-color: var(--line); font-weight: 600; }
.deck-list .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.deck-detail { display: grid; gap: 16px; min-width: 0; }
.deck-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.deck-head input { font-family: var(--display); font-size: 20px; border: 1px solid transparent; background: none; border-radius: 6px; padding: 4px 8px; flex: 1 1 200px; min-width: 0; }
.deck-head input#deck-name-en { font-family: inherit; font-size: 14px; }
.deck-head input:not([readonly]):hover, .deck-head input:not([readonly]):focus { border-color: var(--line); background: var(--surface); }
.summary { display: flex; flex-wrap: wrap; gap: 24px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.total { display: grid; }
.total b { font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.total span, .bars-label { font-size: 12px; color: var(--muted); }
.bars { display: flex; gap: 6px; align-items: end; height: 72px; }
.bar { display: grid; grid-template-rows: auto 1fr auto; justify-items: center; gap: 2px; height: 100%; font-size: 11px; font-variant-numeric: tabular-nums; }
.bar i { width: 18px; align-self: end; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
.bar small { color: var(--muted); }

/* 편집 시트 */
.scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--fg) 35%, transparent); }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); grid-template-columns: minmax(0, 1fr); background: var(--surface); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-head, .sheet-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.sheet-foot { border-bottom: 0; border-top: 1px solid var(--line); }
.sheet-head h2 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 0; flex: 1; }
.sheet-body { overflow: auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 20px; align-items: start; }
@media (max-width: 640px) { .sheet-body { grid-template-columns: minmax(0, 1fr); } .preview { order: -1; justify-self: center; width: 200px; position: static; } }
.form { display: grid; gap: 14px; min-width: 0; }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.field input[type="text"], .field input[type="number"], .field textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 8px 10px; min-width: 0; }
.field input[type="file"] { min-width: 0; max-width: 100%; }
.field textarea { min-height: 140px; resize: vertical; line-height: 1.5; }
.row { display: flex; flex-wrap: wrap; gap: 12px; }
.row > .field { flex: 1 1 120px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 12px; }
.seg button[aria-pressed="true"] { border-color: var(--fg); font-weight: 600; }
.area-edit { display: grid; grid-template-columns: repeat(5, 32px); gap: 4px; }
.area-edit button { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 0; }
.area-edit button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.area-edit button.origin { box-shadow: inset 0 0 0 2px var(--fg); }
.errors { color: var(--danger); font-size: 13px; margin: 0; padding-left: 18px; }
.face-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.face-bar .seg { flex: 1; }
.card-up { background: var(--cat); color: var(--on-accent); }
.preview { position: sticky; top: 0; display: grid; gap: 8px; }
.preview .notice { text-align: center; margin: 0; }

/* 키워드 */
.kw-list { display: grid; gap: 12px; max-width: 720px; }
.kw-row { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.kw-row .row { align-items: center; }
.kw-row input, .kw-row textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 10px; min-width: 0; box-sizing: border-box; }
.kw-row input { flex: 1 1 160px; font-weight: 600; color: var(--kw); }
.kw-row textarea { width: 100%; min-height: 60px; resize: vertical; line-height: 1.5; }
.kw-row .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.chip.kw[aria-pressed="true"] { border-color: var(--kw); color: var(--kw); }
.kw-pop { position: fixed; z-index: 10; width: 220px; max-width: calc(100vw - 16px); box-sizing: border-box; display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: 0 6px 20px color-mix(in srgb, var(--fg) 18%, transparent); pointer-events: none; }
.kw-pop b { color: var(--kw); font-size: 13px; }
.kw-pop p { margin: 2px 0 0; font-size: 12px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }

/* 끌어서 순서 바꾸기 */
.sortable { -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
.sortable img { -webkit-user-drag: none; }
.sortable.dragging { opacity: .45; }
.sortable.drop-target { outline: 2px dashed var(--accent); outline-offset: 3px; }

/* 토스트 */
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; max-width: calc(100% - 32px); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<!-- @inline card_model.js -->
<script>
const M = window.CardModel;
const state = {
  cards: [], decks: [], keywords: [], loaded: false, view: "cards",
  filter: { category: "all", query: "", sort: "name" },
  deckId: null, canWrite: false, writeAllowed: null,
};
let db = null;
let assets = null;
let downloads = null;
const $ = (sel) => document.querySelector(sel);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : String(kid));
  }
  return el;
}

let toastTimer = 0;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

function miniGrid(area) {
  const on = new Set(M.areaOrDefault(area).map(([x, y]) => x + "," + y));
  const g = h("div", { class: "mini", title: "범위" });
  for (let y = -M.AREA_RADIUS; y <= M.AREA_RADIUS; y++) {
    for (let x = -M.AREA_RADIUS; x <= M.AREA_RADIUS; x++) {
      const cls = [on.has(x + "," + y) ? "on" : "", x === 0 && y === 0 ? "origin" : ""].join(" ").trim();
      g.append(h("i", { class: cls || null }));
    }
  }
  return g;
}

// 카드 한 장. onClick 이 있으면 버튼으로 만든다.
function renderCard(card, { count, onClick } = {}) {
  const kws = M.faceKeywords(card, state.keywords);
  const img = card.illustration
    ? h("img", { src: "/_blob/" + card.illustration, alt: "", draggable: "false", onerror: (e) => e.target.remove() })
    : null;
  const art = h("div", { class: "card-art" },
    img,
    h("span", { class: "card-sp", title: "SP " + card.sp }, card.sp),
    h("div", { class: "card-side" },
      h("span", { class: "card-badge", title: M.ATTACK_LABELS[card.attackType] }, M.ATTACK_BADGES[card.attackType]),
      miniGrid(card.area),
      card.upgrades?.length ? h("span", { class: "card-badge card-up", title: `강화 ${card.upgrades.length}단계` }, "+" + card.upgrades.length) : null));
  const body = [
    h("h3", { class: "card-name", title: card.name }, card.name || "이름 없음"),
    art,
    h("div", { class: "card-text" },
      kws.length ? h("div", { class: "card-kws" }, ...kws.map((k) => h("span", {}, k.name))) : null,
      h("p", { class: "card-desc" }, card.description)),
    h("span", { class: "card-cost", title: "덱 코스트" }, "코스트 " + card.cost),
    count ? h("span", { class: "card-count" }, "×" + count) : null,
  ];
  const cls = "card cat-" + card.category;
  const el = onClick
    ? h("button", { class: cls, type: "button", onclick: onClick, "aria-label": card.name + " 편집" }, body)
    : h("article", { class: cls }, body);
  if (kws.length) {
    const show = () => showKeywordPop(el, kws);
    el.addEventListener("mouseenter", show);
    el.addEventListener("focus", show);
    el.addEventListener("mouseleave", hideKeywordPop);
    el.addEventListener("blur", hideKeywordPop);
  }
  return el;
}

// 카드 오른쪽에 키워드 설명. 화면 오른쪽이 모자라면 왼쪽에 띄운다.
function showKeywordPop(anchor, kws) {
  const pop = $("#kw-pop");
  pop.replaceChildren(...kws.map((k) => h("div", {}, h("b", {}, k.name), h("p", {}, k.description || "설명 없음"))));
  pop.hidden = false;
  const r = anchor.getBoundingClientRect();
  const w = pop.offsetWidth, ht = pop.offsetHeight, gap = 8;
  let left = r.right + gap;
  if (left + w > innerWidth - gap) left = r.left - gap - w;
  pop.style.left = Math.max(gap, left) + "px";
  pop.style.top = Math.max(gap, Math.min(r.top, innerHeight - ht - gap)) + "px";
}

function hideKeywordPop() {
  $("#kw-pop").hidden = true;
}

function renderChips() {
  const box = $("#cat-chips");
  box.replaceChildren(
    ...[["all", "전체", null], ...M.CATEGORIES.map((c) => [c, M.CATEGORY_LABELS[c], c])].map(([value, label, cat]) =>
      h("button", {
        class: "chip", type: "button", "aria-pressed": String(state.filter.category === value),
        onclick: () => { state.filter.category = value; render(); },
      }, cat ? h("span", { class: "dot", style: `background:var(--${cat})` }) : null, label)));
}

function renderCardGrid() {
  const grid = $("#card-grid");
  if (!state.loaded) {
    grid.replaceChildren(h("div", { class: "empty" }, "카드를 불러오는 중이에요"));
    return;
  }
  const common = M.cardsInDeck(state.cards, null);
  const list = M.filterSort(common, state.filter);
  if (!common.length) {
    grid.replaceChildren(h("div", { class: "empty" },
      h("strong", {}, "아직 공용 카드가 없어요"),
      state.canWrite ? "오른쪽 위 ‘새 카드’로 첫 공용 카드를 만들어 보세요. 덱 전용 카드는 덱 탭에서 만들어요." : "편집 권한이 있는 사람이 카드를 추가하면 여기에 보여요."));
    return;
  }
  if (!list.length) {
    grid.replaceChildren(h("div", { class: "empty" }, "조건에 맞는 카드가 없어요"));
    return;
  }
  const els = list.map((c) => renderCard(c, { onClick: () => openEditor(c) }));
  grid.replaceChildren(...els);
  const f = state.filter;
  if (state.canWrite && db && f.sort === "manual" && f.category === "all" && !f.query.trim()) {
    makeSortable(els, (from, to) => applyOrder("cards", list, from, to));
  }
}

// 끌어서 순서 바꾸기. 마우스는 조금 끌면, 터치는 길게 누른 뒤 끌면 시작한다.
let dragSuppressClick = false;
let dragPending = false;
document.addEventListener("click", (e) => {
  if (!dragSuppressClick) return;
  dragSuppressClick = false;
  e.stopPropagation();
  e.preventDefault();
}, true);
document.addEventListener("contextmenu", (e) => { if (dragPending) e.preventDefault(); }, true);

function makeSortable(items, onMove) {
  items.forEach((el, from) => {
    el.classList.add("sortable");
    el.addEventListener("pointerdown", (down) => {
      if (down.button !== 0) return;
      const touch = down.pointerType === "touch";
      let dragging = false, target = null, timer = 0;
      const start = () => {
        dragging = true;
        hideKeywordPop();
        el.classList.add("dragging");
        try { el.setPointerCapture(down.pointerId); } catch {}
      };
      const setTarget = (t) => {
        if (target === t) return;
        target?.classList.remove("drop-target");
        target = t;
        target?.classList.add("drop-target");
      };
      const move = (e) => {
        if (e.pointerId !== down.pointerId) return;
        const dist = Math.hypot(e.clientX - down.clientX, e.clientY - down.clientY);
        if (!dragging) {
          if (touch) { if (dist > 8) cleanup(); return; }
          if (dist < 6) return;
          start();
        }
        const hit = items.find((it) => {
          const r = it.getBoundingClientRect();
          return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        });
        setTarget(hit && hit !== el ? hit : null);
      };
      // 길게 누른 뒤 끄는 동안 화면이 스크롤되지 않게 한다.
      const blockScroll = (e) => { if (dragging) e.preventDefault(); };
      const up = (e) => {
        if (e.pointerId !== down.pointerId) return;
        const to = dragging && target && e.type === "pointerup" ? items.indexOf(target) : -1;
        if (dragging) {
          dragSuppressClick = true;
          setTimeout(() => { dragSuppressClick = false; }, 0);
        }
        cleanup();
        if (to >= 0 && el.isConnected) onMove(from, to);
      };
      function cleanup() {
        clearTimeout(timer);
        dragPending = false;
        setTarget(null);
        el.classList.remove("dragging");
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
        window.removeEventListener("pointercancel", up);
        window.removeEventListener("touchmove", blockScroll);
      }
      if (touch) { dragPending = true; timer = setTimeout(start, 350); }
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
      window.addEventListener("pointercancel", up);
      window.addEventListener("touchmove", blockScroll, { passive: false });
    });
  });
}

const deckSort = M.byOrder((a, b) => a.createdAt - b.createdAt);

// 화면에 먼저 반영하고 저장한다. 달라진 문서만 order 를 고친다.
async function applyOrder(collection, list, from, to) {
  const writes = M.reorderWrites(list, from, to);
  if (!writes.length) return;
  const items = collection === "cards" ? state.cards : state.decks;
  for (const w of writes) {
    const it = items.find((x) => x.id === w.id);
    if (it) it.order = w.order;
  }
  state.decks.sort(deckSort);
  render();
  try {
    for (const w of writes) await db.doc(collection + "/" + w.id).update({ order: w.order });
  } catch (e) { writeFailed(e); }
}

function render() {
  for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-selected", String(b.dataset.view === state.view));
  $("#view-cards").hidden = state.view !== "cards";
  $("#view-decks").hidden = state.view !== "decks";
  $("#view-keywords").hidden = state.view !== "keywords";
  $("#new-card").hidden = !state.canWrite || state.view !== "cards";
  hideKeywordPop();
  if (state.view === "cards") { renderChips(); renderCardGrid(); }
  else if (state.view === "decks") renderDecks();
  else renderKeywords();
}

// 편집 중인 초안. id 가 없으면 아직 저장 안 된 새 카드.
// draft.face: 지금 보고 있는 면 ("base" 또는 강화 단계 index 0..4). 입력 칸은 이 면을 고친다.
let draft = null;
let deleteArmed = false;

function draftCard() {
  return { id: draft.id, ...M.normalizeCard(draft) };
}

// 입력 칸이 고치는 객체: 기본 면이면 draft, 강화 면이면 draft.upgrades[i].
function face() {
  return draft.face === "base" ? draft : draft.upgrades[draft.face];
}

function syncEditorPreview() {
  const card = draftCard();
  $("#f-preview").replaceChildren(renderCard(draft.face === "base" ? card : card.upgrades[draft.face]));
}

function editableFace(f) {
  return { ...f, area: [...f.area], keywords: [...f.keywords], sp: String(f.sp), cost: String(f.cost) };
}

function editableCard(card) {
  return { ...editableFace(card), id: card.id ?? null, deckId: card.deckId, upgrades: card.upgrades.map(editableFace), face: "base" };
}

function setFace(name) {
  draft.face = name;
  fillEditorInputs();
  renderEditorControls();
  syncEditorPreview();
}

function renderSeg(box, values, labels, current, onPick) {
  box.replaceChildren(...values.map((v) => h("button", {
    type: "button", "aria-pressed": String(v === current), disabled: !state.canWrite,
    onclick: () => { onPick(v); renderEditorControls(); syncEditorPreview(); },
  }, labels[v])));
}

function renderEditorControls() {
  const faces = [["base", "기본"], ...draft.upgrades.map((_, i) => [i, "강화 " + (i + 1)])];
  const canAdd = state.canWrite && draft.upgrades.length < M.MAX_UPGRADES;
  $("#f-face").replaceChildren(
    ...faces.map(([v, label]) => h("button", {
      type: "button", "aria-pressed": String(draft.face === v), onclick: () => setFace(v),
    }, label)),
    canAdd ? h("button", {
      type: "button", title: `최대 ${M.MAX_UPGRADES}개`,
      onclick: () => { draft.upgrades.push(editableFace(M.newUpgrade(draftCard()))); setFace(draft.upgrades.length - 1); },
    }, "+ 강화 추가") : null);
  $("#f-up-remove").hidden = !state.canWrite || draft.face === "base";
  const f = face();
  renderSeg($("#f-category"), M.CATEGORIES, M.CATEGORY_LABELS, f.category, (v) => { face().category = v; });
  renderSeg($("#f-attack"), M.ATTACK_TYPES, M.ATTACK_LABELS, f.attackType, (v) => { face().attackType = v; });
  const on = new Set(f.area.map(([x, y]) => x + "," + y));
  const cells = [];
  for (let y = -M.AREA_RADIUS; y <= M.AREA_RADIUS; y++) {
    for (let x = -M.AREA_RADIUS; x <= M.AREA_RADIUS; x++) {
      cells.push(h("button", {
        type: "button", class: x === 0 && y === 0 ? "origin" : null, disabled: !state.canWrite,
        "aria-pressed": String(on.has(x + "," + y)), "aria-label": `열 ${x}, 행 ${y}`,
        onclick: () => { face().area = M.toggleCell(face().area, x, y); renderEditorControls(); syncEditorPreview(); },
      }));
    }
  }
  $("#f-area").replaceChildren(...cells);
  const picked = new Set(f.keywords);
  $("#f-keywords").replaceChildren(...(state.keywords.length
    ? [...state.keywords].sort((a, b) => a.name.localeCompare(b.name, "ko")).map((k) => h("button", {
        type: "button", class: "chip kw", "aria-pressed": String(picked.has(k.id)), disabled: !state.canWrite, title: k.description,
        onclick: () => {
          const cur = face();
          cur.keywords = picked.has(k.id) ? cur.keywords.filter((id) => id !== k.id) : [...cur.keywords, k.id];
          renderEditorControls();
          syncEditorPreview();
        },
      }, k.name))
    : [h("span", { class: "notice" }, "키워드 탭에서 먼저 키워드를 추가하세요")]));
  const saved = Boolean(draft.id);
  const w = state.canWrite;
  const targets = state.decks.filter((d) => d.id !== draft.deckId);
  $("#f-save").hidden = !w;
  $("#f-dup").hidden = !w;
  $("#f-dup").disabled = !saved;
  $("#f-delete").hidden = !w || !saved;
  $("#f-deck").hidden = !w || !saved || !targets.length;
  $("#f-add-deck").hidden = !w || !saved || !targets.length;
  const pickedDeck = $("#f-deck").value;
  $("#f-deck").replaceChildren(...targets.map((d) => h("option", { value: d.id }, d.name)));
  if (targets.some((d) => d.id === pickedDeck)) $("#f-deck").value = pickedDeck;
  renderEditorTitle();
  $("#f-illust-field").hidden = !assets;
  $("#f-illust-clear").disabled = !f.illustration;
}

function fillEditorInputs() {
  const f = face();
  $("#f-name").value = f.name;
  $("#f-sp").value = f.sp;
  $("#f-cost").value = f.cost;
  $("#f-desc").value = f.description;
  $("#f-name-en").value = f.nameEn ?? "";
  $("#f-desc-en").value = f.descriptionEn ?? "";
  $("#f-illust").value = "";
}

function ownerName(deckId) {
  if (!deckId) return "공용 카드";
  return state.decks.find((d) => d.id === deckId)?.name ?? "지워진 덱";
}

function renderEditorTitle() {
  const action = !state.canWrite ? "카드 보기" : draft.id ? "카드 편집" : "새 카드";
  $("#editor-title").textContent = `${ownerName(draft.deckId)} · ${action}`;
}

// deckId: 새 카드를 만들 덱. 없으면 공용 카드.
function openEditor(card, deckId = null) {
  draft = editableCard(card ?? M.normalizeCard({ name: "", sp: 1, deckId }));
  deleteArmed = false;
  $("#f-delete").classList.remove("armed");
  $("#f-delete").textContent = "삭제";
  fillEditorInputs();
  showErrors([]);
  for (const id of ["#f-name", "#f-sp", "#f-cost", "#f-desc", "#f-name-en", "#f-desc-en"]) $(id).readOnly = !state.canWrite;
  renderEditorControls();
  syncEditorPreview();
  $("#editor").hidden = false;
  $("#f-name").focus();
}

function closeEditor() {
  $("#editor").hidden = true;
  draft = null;
}

function showErrors(list) {
  const ul = $("#f-errors");
  ul.replaceChildren(...list.map((m) => h("li", {}, m)));
  ul.hidden = !list.length;
}

function writeFailed(e) {
  console.warn("write", e);
  const kind = M.writeErrorKind(e, state.writeAllowed);
  if (kind === "too_large") {
    toast("내용이 너무 길어 저장하지 못했어요. 설명을 줄여 주세요.");
  } else if (kind === "readonly") {
    state.canWrite = false;
    $("#notice").textContent = "읽기 전용으로 보고 있어요.";
    toast("편집 권한이 없어 저장하지 못했어요.");
    render();
    if (draft) renderEditorControls();
  } else if (kind === "quota") {
    toast("저장 공간이 가득 찼어요. 안 쓰는 카드를 지운 뒤 다시 저장하세요.");
  } else {
    toast("저장하지 못했어요. 잠시 후 다시 시도하세요.");
  }
}

$("#f-name").addEventListener("input", (e) => { face().name = e.target.value; syncEditorPreview(); });
$("#f-sp").addEventListener("input", (e) => { face().sp = e.target.value; syncEditorPreview(); });
$("#f-cost").addEventListener("input", (e) => { face().cost = e.target.value; syncEditorPreview(); });
$("#f-desc").addEventListener("input", (e) => { face().description = e.target.value; syncEditorPreview(); });
$("#f-name-en").addEventListener("input", (e) => { face().nameEn = e.target.value; });
$("#f-desc-en").addEventListener("input", (e) => { face().descriptionEn = e.target.value; });
$("#f-up-remove").addEventListener("click", () => {
  draft.upgrades.splice(draft.face, 1);
  setFace(draft.face > 0 ? draft.face - 1 : draft.upgrades.length ? 0 : "base");
});
$("#editor-close").addEventListener("click", closeEditor);
$("#editor-scrim").addEventListener("click", closeEditor);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && draft) closeEditor(); });

$("#f-illust").addEventListener("change", async (e) => {
  const file = e.target.files?.[0];
  if (!file || !assets || !draft) return;
  try {
    const res = await assets.upload(file);
    if (!draft || !face()) return;
    face().illustration = res.id;
    refreshUsage();
    renderEditorControls();
    syncEditorPreview();
  } catch (err) {
    console.warn("upload", err);
    toast(err?.code === "too_large" ? "20MB 이하 그림만 올릴 수 있어요."
      : err?.code === "unsupported_type" ? "PNG, JPG, WEBP, GIF 그림만 올릴 수 있어요."
      : "그림을 올리지 못했어요.");
  }
});
$("#f-illust-clear").addEventListener("click", () => {
  face().illustration = null;
  $("#f-illust").value = "";
  renderEditorControls();
  syncEditorPreview();
});

$("#f-save").addEventListener("click", async () => {
  const errors = M.validateCard(draft);
  showErrors(errors);
  if (errors.length || !db) return;
  const body = M.normalizeCard(draft);
  const prev = draft.id ? state.cards.find((c) => c.id === draft.id) : null;
  const wasNew = !draft.id;
  const ref = draft.id ? db.doc("cards/" + draft.id) : db.collection("cards").doc();
  const saving = draft;
  // 연타해도 새 카드가 둘 생기지 않게: 버튼을 잠그고 id 를 먼저 정한다.
  saving.id = ref.id;
  $("#f-save").disabled = true;
  try {
    await ref.set({ ...body, createdAt: prev?.createdAt ?? Date.now(), ...(typeof prev?.order === "number" ? { order: prev.order } : {}) });
    if (draft !== saving) return;
    toast("저장했어요");
    renderEditorControls();
  } catch (e) {
    if (wasNew) saving.id = null;
    writeFailed(e);
  } finally {
    $("#f-save").disabled = false;
  }
});

$("#f-dup").addEventListener("click", () => {
  const copy = { ...draftCard(), id: null, name: draft.name.trim() + " 사본" };
  openEditor(null, copy.deckId);
  draft = editableCard(copy);
  fillEditorInputs();
  renderEditorControls();
  syncEditorPreview();
});

$("#f-add-deck").addEventListener("click", async () => {
  const deck = state.decks.find((d) => d.id === $("#f-deck").value);
  if (!deck || !draft?.id) return;
  const errors = M.validateCard(draft);
  showErrors(errors);
  if (errors.length) return;
  // 일러스트 id 는 사본과 공유한다 (삭제 시 isAssetShared 가 지켜 준다).
  const copy = { ...M.normalizeCard(draft), deckId: deck.id, createdAt: Date.now() };
  $("#f-add-deck").disabled = true;
  try {
    await db.collection("cards").doc().set(copy);
    toast(`${deck.name}에 복사했어요`);
  } catch (e) {
    writeFailed(e);
  } finally {
    $("#f-add-deck").disabled = false;
  }
});

$("#f-delete").addEventListener("click", async () => {
  if (!deleteArmed) {
    deleteArmed = true;
    $("#f-delete").classList.add("armed");
    $("#f-delete").textContent = "한 번 더 누르면 삭제";
    return;
  }
  const id = draft.id;
  const illustrations = M.cardAssets(draftCard());
  try {
    await db.doc("cards/" + id).delete();
    for (const a of illustrations) {
      if (assets && !M.isAssetShared(state.cards, a, id)) {
        await assets.delete(a).catch((e) => console.warn("asset delete", e));
      }
    }
    closeEditor();
    toast("삭제했어요");
    refreshUsage();
  } catch (e) { writeFailed(e); }
});
let deckDeleteArmed = null;

// 덱은 평평한 필드(name, nameEn, createdAt, order)뿐이라 한 필드만 update 해도 안전하다.
// 통째로 set 하면 포커스 중 낡은 deck 값이 방금 저장한 다른 필드를 덮어쓴다.
async function saveDeckField(deck, field, value) {
  const cur = state.decks.find((d) => d.id === deck.id) ?? deck;
  const curVal = field === "nameEn" ? (cur.nameEn ?? "") : cur[field];
  if (value === curVal) return;
  try {
    await db.doc("decks/" + deck.id).update({ [field]: value });
  } catch (e) { writeFailed(e); }
}

async function createDeck() {
  try {
    const ref = db.collection("decks").doc();
    await ref.set({ name: "새 덱", nameEn: "", createdAt: Date.now() });
    state.deckId = ref.id;
    renderDecks();
  } catch (e) { writeFailed(e); }
}

function renderDecks() {
  const root = $("#view-decks");
  if (!state.decks.find((d) => d.id === state.deckId)) state.deckId = state.decks[0]?.id ?? null;
  const deck = state.decks.find((d) => d.id === state.deckId);
  const ro = !state.canWrite || !db;

  const deckBtns = state.decks.map((d) => h("button", {
    type: "button", class: "item", "aria-current": String(d.id === state.deckId),
    onclick: () => { state.deckId = d.id; deckDeleteArmed = null; renderDecks(); },
  }, h("span", {}, d.name), h("span", { class: "n" }, M.cardsInDeck(state.cards, d.id).length + "장")));
  if (!ro) makeSortable(deckBtns, (from, to) => applyOrder("decks", state.decks, from, to));
  const list = h("nav", { class: "deck-list", "aria-label": "덱 목록" },
    ...deckBtns,
    ro ? null : h("button", { type: "button", class: "btn", onclick: createDeck }, "새 덱"));

  if (!deck) {
    root.replaceChildren(h("div", { class: "decks" }, list,
      h("div", { class: "empty" }, h("strong", {}, "아직 덱이 없어요"),
        ro ? "편집 권한이 있는 사람이 덱을 만들면 여기에 보여요." : "‘새 덱’으로 만들고 카드를 추가해 보세요.")));
    return;
  }

  const rows = M.cardsInDeck(state.cards, deck.id);
  const hist = M.spHistogram(rows);
  const peak = Math.max(1, ...hist.map((b) => b.count));

  const nameInput = h("input", { id: "deck-name", type: "text", value: deck.name, "aria-label": "덱 이름", readonly: ro });
  nameInput.addEventListener("change", () => {
    const name = nameInput.value.trim() || "이름 없는 덱";
    saveDeckField(deck, "name", name);
  });

  const nameEnInput = h("input", { id: "deck-name-en", type: "text", value: deck.nameEn ?? "", placeholder: "영어 이름", "aria-label": "덱 영어 이름", readonly: ro });
  nameEnInput.addEventListener("change", () => {
    const nameEn = nameEnInput.value.trim();
    saveDeckField(deck, "nameEn", nameEn);
  });

  const armed = deckDeleteArmed === deck.id;
  const delBtn = ro ? null : h("button", {
    type: "button", class: "btn danger" + (armed ? " armed" : ""),
    onclick: async () => {
      if (!armed) { deckDeleteArmed = deck.id; renderDecks(); return; }
      deckDeleteArmed = null;
      try {
        // 덱 카드 → 다른 카드가 안 쓰는 일러스트 → 덱 순서로 지운다.
        for (const card of rows) await db.doc("cards/" + card.id).delete();
        if (assets) {
          for (const id of M.assetsFreedByDeckDelete(state.cards, deck.id)) {
            await assets.delete(id).catch((e) => console.warn("asset delete", e));
          }
        }
        await db.doc("decks/" + deck.id).delete();
        toast("덱을 삭제했어요");
        refreshUsage();
      } catch (e) { writeFailed(e); }
    },
  }, armed ? `한 번 더 누르면 삭제 (카드 ${rows.length}장도 삭제)` : "덱 삭제");

  const newBtn = ro ? null : h("button", { type: "button", class: "btn primary", onclick: () => openEditor(null, deck.id) }, "이 덱에 새 카드");

  const summary = h("div", { class: "summary" },
    h("div", { class: "total" }, h("b", {}, rows.length), h("span", {}, "카드 수")),
    h("div", { class: "total" }, h("b", {}, M.averageCost(rows) ?? "–"), h("span", {}, "코스트 평균")),
    h("div", {},
      h("div", { class: "bars-label" }, "SP별 카드 수"),
      hist.length
        ? h("div", { class: "bars" }, ...hist.map((b) => h("div", { class: "bar", title: `SP ${b.sp}: ${b.count}장` },
            h("span", {}, b.count), h("i", { style: `height:${Math.round((b.count / peak) * 40)}px` }), h("small", {}, "SP " + b.sp))))
        : h("div", { class: "notice" }, "카드가 없어요")));

  const cardEls = rows.map((card) => renderCard(card, { onClick: () => openEditor(card) }));
  if (!ro) makeSortable(cardEls, (from, to) => applyOrder("cards", rows, from, to));
  const grid = rows.length
    ? h("div", { class: "grid" }, ...cardEls)
    : h("div", { class: "empty" }, ro ? "이 덱은 비어 있어요." : "이 덱은 비어 있어요. ‘이 덱에 새 카드’로 카드를 만들어 보세요.");

  // 다른 사람의 저장으로 다시 그려질 때 입력 중인 덱 이름을 잃지 않게 한다.
  const typing = /^deck-name(-en)?$/.test(document.activeElement?.id ?? "") && document.activeElement.dataset.deck === deck.id
    ? document.activeElement : null;
  nameInput.dataset.deck = deck.id;
  nameEnInput.dataset.deck = deck.id;
  const typed = typing && (typing.id === "deck-name" ? nameInput : nameEnInput);
  if (typing) typed.value = typing.value;
  root.replaceChildren(h("div", { class: "decks" }, list,
    h("div", { class: "deck-detail" }, h("div", { class: "deck-head" }, nameInput, nameEnInput, newBtn, delBtn), summary, grid)));
  if (typing) {
    typed.focus();
    typed.setSelectionRange(typing.selectionStart, typing.selectionEnd);
  }
}

let kwDeleteArmed = null;
let kwFocusId = null;
let kwRenderPending = false;

// 필드 하나만 update 한다. 입력칸을 옮겨 다니는 동안은 다시 그리지 않아 kw 가 낡을 수 있으므로,
// 통째로 set 하면 방금 저장한 다른 필드가 지워진다. 비교도 최신 state.keywords 로 한다.
async function saveKeywordField(kw, field, value) {
  const cur = state.keywords.find((k) => k.id === kw.id) ?? kw;
  if (value === (cur[field] ?? "")) return;
  try {
    await db.doc("keywords/" + kw.id).update({ [field]: value });
  } catch (e) { writeFailed(e); }
}

async function createKeyword() {
  try {
    const ref = db.collection("keywords").doc();
    kwFocusId = ref.id;
    await ref.set({ name: "새 키워드", nameEn: "", description: "", descriptionEn: "", createdAt: Date.now() });
  } catch (e) { kwFocusId = null; writeFailed(e); }
}

function renderKeywords() {
  const root = $("#view-keywords");
  // 입력 중에 다른 사람의 저장이 와도 글자를 잃지 않게, 포커스가 빠질 때 다시 그린다.
  if (root.contains(document.activeElement) && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    kwRenderPending = true;
    return;
  }
  kwRenderPending = false;
  const ro = !state.canWrite || !db;
  const head = h("div", { class: "toolbar" },
    h("span", { class: "notice" }, "카드에 붙이면 설명 위에 표시되고, 카드에 마우스를 올리면 설명이 떠요."),
    ro ? null : h("button", { type: "button", class: "btn primary", onclick: createKeyword }, "새 키워드"));
  if (!state.keywords.length) {
    root.replaceChildren(head, h("div", { class: "empty" }, h("strong", {}, "아직 키워드가 없어요"),
      ro ? "편집 권한이 있는 사람이 키워드를 추가하면 여기에 보여요." : "‘새 키워드’로 출혈, 관통 같은 키워드를 만들어 보세요."));
    return;
  }
  const rows = state.keywords.map((kw) => {
    const used = M.keywordUsage(state.cards, kw.id);
    const name = h("input", { type: "text", value: kw.name, "aria-label": "키워드 이름", readonly: ro, "data-kw": kw.id });
    name.addEventListener("change", () => {
      const v = name.value.trim();
      if (M.validateKeyword({ name: v }).length) { name.value = (state.keywords.find((k) => k.id === kw.id) ?? kw).name; toast("키워드 이름을 입력하세요"); return; }
      saveKeywordField(kw, "name", v);
    });
    const nameEn = h("input", { type: "text", value: kw.nameEn ?? "", "aria-label": "키워드 영어 이름", placeholder: "영어 이름", readonly: ro });
    nameEn.addEventListener("change", () => {
      const v = nameEn.value.trim();
      saveKeywordField(kw, "nameEn", v);
    });
    const desc = h("textarea", { "aria-label": kw.name + " 설명", placeholder: "설명", readonly: ro });
    desc.value = kw.description;
    desc.addEventListener("change", () => saveKeywordField(kw, "description", desc.value));
    const descEn = h("textarea", { "aria-label": kw.name + " 영어 설명", placeholder: "영어 설명", readonly: ro });
    descEn.value = kw.descriptionEn ?? "";
    descEn.addEventListener("change", () => saveKeywordField(kw, "descriptionEn", descEn.value));
    const armed = kwDeleteArmed === kw.id;
    const del = ro ? null : h("button", {
      type: "button", class: "btn danger" + (armed ? " armed" : ""),
      onclick: async () => {
        if (!armed) { kwDeleteArmed = kw.id; renderKeywords(); return; }
        kwDeleteArmed = null;
        try {
          await db.doc("keywords/" + kw.id).delete();
          toast("키워드를 삭제했어요");
        } catch (e) { writeFailed(e); }
      },
    }, armed ? (used ? `한 번 더 누르면 삭제 (카드 ${used}장에서 빠짐)` : "한 번 더 누르면 삭제") : "삭제");
    return h("div", { class: "kw-row" }, h("div", { class: "row" }, name, nameEn, h("span", { class: "n" }, `카드 ${used}장`), del), desc, descEn);
  });
  root.replaceChildren(head, h("div", { class: "kw-list" }, ...rows));
  if (kwFocusId) {
    const input = root.querySelector(`input[data-kw="${kwFocusId}"]`);
    if (input) { kwFocusId = null; input.focus(); input.select(); }
  }
}

$("#view-keywords").addEventListener("focusout", () => {
  setTimeout(() => { if (kwRenderPending && state.view === "keywords") renderKeywords(); }, 0);
});
window.addEventListener("scroll", hideKeywordPop, true);

for (const b of document.querySelectorAll(".tabs button")) {
  b.addEventListener("click", () => { state.view = b.dataset.view; render(); });
}
$("#search").addEventListener("input", (e) => { state.filter.query = e.target.value; renderCardGrid(); });
$("#sort").addEventListener("change", (e) => { state.filter.sort = e.target.value; renderCardGrid(); });
$("#new-card").addEventListener("click", () => openEditor(null));

// 이 코드들은 다시 눌러도 소용없는 환경 문제라 버튼을 숨긴다. 모르는 코드도 unavailable 처럼 본다.
const EXPORT_KEEP = new Set(["too_large", "bad_request", "rejected_extension", "extension_not_enabled", "transform_error", "request_unknown"]);
const ART_EXT = { "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp", "image/gif": "gif" };

// 카드·그림을 zip 하나로 받는다. 그림 하나를 못 가져와도 계속 진행한다.
const firstSnap = { cards: false, decks: false, keywords: false };
let exporting = false;
function syncExportBtn() {
  $("#export").disabled = exporting || !(firstSnap.cards && firstSnap.decks && firstSnap.keywords);
}

async function exportZip() {
  if (exporting || $("#export").disabled) return;
  exporting = true;
  syncExportBtn();
  try {
    const paths = new Map();
    const files = [];
    let missing = 0;
    for (const id of M.exportAssets(state.cards, state.decks)) {
      try {
        const res = await fetch("/_blob/" + id);
        if (!res.ok) throw new Error(String(res.status));
        const type = (res.headers.get("content-type") || "").split(";")[0].trim().toLowerCase();
        const path = "art/" + id + "." + (ART_EXT[type] ?? "bin");
        files.push({ name: path, bytes: new Uint8Array(await res.arrayBuffer()) });
        paths.set(id, path);
      } catch (e) {
        console.warn("export art", id, e);
        missing++;
      }
    }
    const json = M.buildExport(state, (id) => paths.get(id) ?? null);
    files.unshift({ name: "cards.json", bytes: new TextEncoder().encode(JSON.stringify(json, null, 2)) });
    const zip = M.makeZip(files);
    const result = await downloads.save({ filename: "project-void-cards.zip", data: new Blob([zip]) });
    if (missing) toast("그림 " + missing + "개를 넣지 못했어요");
    else if (result?.status === "saved") toast("내보냈어요");
  } catch (e) {
    if (e?.code === "declined") return;
    console.warn("export", e);
    if (e?.code === "rate_limited") toast("잠시 후 다시 눌러 주세요");
    else {
      toast("내보내지 못했어요");
      if (!EXPORT_KEEP.has(e?.code)) $("#export").hidden = true;
    }
  } finally {
    exporting = false;
    syncExportBtn();
  }
}
$("#export").addEventListener("click", exportZip);

// 그림 저장 공간. 편집 권한이 있는 사람(assets 있음)에게만 보인다.
async function refreshUsage() {
  if (!assets) return;
  try {
    const { usage } = await assets.list();
    const { text, warn } = M.formatUsage(usage);
    const el = $("#usage");
    el.textContent = text;
    el.classList.toggle("warn", warn);
    el.hidden = false;
  } catch (e) {
    console.warn("usage", e);
  }
}

function onDbError(e) {
  $("#notice").textContent = "저장소 연결이 끊겼어요. 새로고침해 주세요.";
  console.warn("db", e);
}

function orderOf(data) {
  return typeof data.order === "number" ? { order: data.order } : {};
}

async function boot() {
  render();
  if (!window.claude?.use) {
    state.loaded = true;
    $("#notice").textContent = "claude.ai 에서 열어야 카드가 저장돼요.";
    render();
    return;
  }
  db = await claude.use("db");
  if (!db) {
    state.loaded = true;
    $("#notice").textContent = "저장소를 쓸 수 없어요. 로그인했는지 확인해 주세요.";
    render();
    return;
  }
  const user = await claude.use("user");
  state.writeAllowed = user ? await user.can("data.write") : null;
  state.canWrite = state.writeAllowed !== false;
  assets = state.canWrite ? await claude.use("assets") : null;
  downloads = await claude.use("downloads");
  $("#export").hidden = !downloads;
  $("#export").disabled = true;
  refreshUsage();
  if (!state.canWrite) $("#notice").textContent = "읽기 전용으로 보고 있어요.";
  db.collection("cards").onSnapshot((snap) => {
    state.cards = snap.docs.map((d) => ({ id: d.id, ...M.normalizeCard(d.data()), ...orderOf(d.data()) }));
    state.loaded = true;
    firstSnap.cards = true;
    syncExportBtn();
    render();
  }, onDbError);
  db.collection("decks").onSnapshot((snap) => {
    state.decks = snap.docs
      .map((d) => ({ id: d.id, createdAt: d.data().createdAt || 0, ...M.normalizeDeck(d.data()), ...orderOf(d.data()) }))
      .sort(deckSort);
    firstSnap.decks = true;
    syncExportBtn();
    render();
  }, onDbError);
  db.collection("keywords").onSnapshot((snap) => {
    state.keywords = snap.docs
      .map((d) => ({ id: d.id, createdAt: d.data().createdAt || 0, ...M.normalizeKeyword(d.data()) }))
      .sort((a, b) => a.createdAt - b.createdAt);
    firstSnap.keywords = true;
    syncExportBtn();
    render();
    if (draft) { renderEditorControls(); syncEditorPreview(); }
  }, onDbError);
}
boot();
</script>
